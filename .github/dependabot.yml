version: 2
# The single group also keeps the certificate crates (cms, der, spki, x509-cert
# and friends) together; they share types, so a lone bump fails to compile.
# Every ecosystem below is batched into one weekly pull request per repository.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
