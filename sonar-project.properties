# CI-based SonarCloud analysis. Automatic analysis must be disabled before
# enabling the SONAR_TOKEN-backed workflow to avoid conflicting scans.
sonar.projectKey=navaneethbv_navpdf
sonar.organization=navaneethbv

sonar.projectName=NavPDF
sonar.projectVersion=0.2.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage is produced by `npm run test:coverage` (vitest v8 provider).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated, vendored, or binary paths carry no reviewable source.
sonar.exclusions=tests/**,scripts/**,.github/**,dist/**,coverage/**,node_modules/**,src-tauri/target/**,public/pdfjs/**,graphify-out/**,build/**
sonar.coverage.exclusions=tests/**,scripts/**,vite.config.ts,eslint.config.js,src/main.tsx
