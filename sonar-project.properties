# SonarCloud configuration.
#
# Before the Sonar job can run, set these two values to match your SonarCloud
# project and add a SONAR_TOKEN repository secret. Until then the workflow
# skips analysis rather than failing the build.
sonar.projectKey=CHANGEME_navpdf
sonar.organization=CHANGEME_org

sonar.projectName=NavPDF
sonar.projectVersion=0.2.0

sonar.sources=src,src-tauri/src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage is produced by `npm run test:coverage` (vitest v8 provider).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated, vendored, or binary paths carry no reviewable source.
sonar.exclusions=dist/**,coverage/**,node_modules/**,src-tauri/target/**,public/pdfjs/**,graphify-out/**,build/**
sonar.coverage.exclusions=tests/**,scripts/**,vite.config.ts,eslint.config.js,src/main.tsx
